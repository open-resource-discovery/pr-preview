<svg xmlns="http://www.w3.org/2000/svg" width="960" height="820" viewBox="0 0 960 820" role="img" aria-labelledby="title description">
  <title id="title">ORD perspective resolution</title>
  <desc id="description">Resolution paths for system-instance ORD resource lookups and static metadata requests. A resource omitted from a published system-instance perspective is not available on that system instance.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 8 4 0 8z" class="arrow-head"/>
    </marker>
    <style>
      svg { color-scheme: light dark; font-family: Arial, Helvetica, sans-serif; }
      .entry { fill: light-dark(#dae8fc, #1e3a5f); stroke: light-dark(#6c8ebf, #8ab4f8); stroke-width: 2; }
      .decision { fill: light-dark(#f5f5f5, #2b2d31); stroke: light-dark(#666, #c5c7ca); stroke-width: 1.5; }
      .success { fill: light-dark(#d5e8d4, #1f4328); stroke: light-dark(#82b366, #88cf8c); stroke-width: 2; }
      .failure { fill: light-dark(#f8cecc, #572727); stroke: light-dark(#b85450, #ef8b87); stroke-width: 2; }
      .edge { fill: none; stroke: light-dark(#4d4d4d, #d4d4d4); stroke-width: 1.5; marker-end: url(#arrow); }
      .divider { stroke: light-dark(#c7c7c7, #666); stroke-width: 1; stroke-dasharray: 4 5; }
      .arrow-head { fill: context-stroke; }
      text { fill: light-dark(#1f2328, #f2f3f5); font-size: 14px; text-anchor: middle; dominant-baseline: middle; }
      .label { font-size: 12px; paint-order: stroke; stroke: light-dark(#fff, #1b1b1b); stroke-width: 4px; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- System-instance resource lookup -->
  <rect class="entry" x="10" y="26" width="175" height="48" rx="7"/>
  <text x="97.5" y="42"><tspan x="97.5">System-instance</tspan><tspan x="97.5" dy="17">resource lookup</tspan></text>
  <polygon class="decision" points="270,2 345,50 270,98 195,50"/>
  <text x="270" y="42"><tspan x="270">System-instance</tspan><tspan x="270" dy="17">perspective published?</tspan></text>
  <path class="edge" d="M185 50h10"/>
  <polygon class="decision" points="470,2 545,50 470,98 395,50"/>
  <text x="470" y="33"><tspan x="470">ORD ID in</tspan><tspan x="470" dy="17">system-instance</tspan><tspan x="470" dy="17">perspective?</tspan></text>
  <path class="edge" d="M345 50h50"/>
  <text class="label" x="370" y="40">Yes</text>
  <rect class="success" x="650" y="20" width="290" height="60" rx="7"/>
  <text x="795" y="33"><tspan x="795">Return resource from</tspan><tspan x="795" dy="17">system-instance</tspan><tspan x="795" dy="17">perspective</tspan></text>
  <path class="edge" d="M545 50h105"/>
  <text class="label" x="570" y="40">Yes</text>
  <rect class="failure" x="650" y="112" width="290" height="56" rx="7"/>
  <text x="795" y="131"><tspan x="795">Resource not available</tspan><tspan x="795" dy="17">on system instance</tspan></text>
  <path class="edge" d="M470 98v42h180"/>
  <text class="label" x="484" y="110">No</text>

  <polygon class="decision" points="270,182 345,230 270,278 195,230"/>
  <text x="270" y="222"><tspan x="270">System version</tspan><tspan x="270" dy="17">known?</tspan></text>
  <path class="edge" d="M270 98v84"/>
  <text class="label" x="284" y="118">No</text>

  <polygon class="decision" points="470,182 545,230 470,278 395,230"/>
  <text x="470" y="213"><tspan x="470">Exact</tspan><tspan x="470" dy="17">system-version view</tspan><tspan x="470" dy="17">available?</tspan></text>
  <path class="edge" d="M345 230h50"/>
  <text class="label" x="370" y="220">Yes</text>
  <rect class="success" x="650" y="203" width="290" height="56" rx="7"/>
  <text x="795" y="214"><tspan x="795">Resolve exact system-version</tspan><tspan x="795" dy="17">over system-type, then</tspan><tspan x="795" dy="17">look up the ORD ID</tspan></text>
  <path class="edge" d="M545 230h105"/>
  <text class="label" x="570" y="220">Yes</text>
  <rect class="failure" x="650" y="290" width="290" height="46" rx="7"/>
  <text x="795" y="313">Cannot determine resource availability</text>
  <path class="edge" d="M470 278v35h180"/>
  <text class="label" x="484" y="289">No</text>

  <polygon class="decision" points="470,342 545,390 470,438 395,390"/>
  <text x="470" y="373"><tspan x="470">Stable</tspan><tspan x="470" dy="17">system-version view</tspan><tspan x="470" dy="17">available?</tspan></text>
  <path class="edge" d="M270 278v112h125"/>
  <text class="label" x="284" y="295">No</text>
  <rect class="success" x="650" y="353" width="290" height="56" rx="7"/>
  <text x="795" y="364"><tspan x="795">Resolve latest stable system-version</tspan><tspan x="795" dy="17">over system-type, then</tspan><tspan x="795" dy="17">look up the ORD ID</tspan></text>
  <path class="edge" d="M545 390h105"/>
  <text class="label" x="570" y="380">Yes</text>
  <rect class="success" x="650" y="425" width="290" height="46" rx="7"/>
  <text x="795" y="439"><tspan x="795">Look up the ORD ID in system-type;</tspan><tspan x="795" dy="17">otherwise no static resource is available</tspan></text>
  <path class="edge" d="M470 438v10h180"/>
  <text class="label" x="484" y="444">No</text>

  <path class="divider" d="M10 490h930"/>

  <!-- Explicit version request -->
  <g transform="translate(0 38)">
  <rect class="entry" x="10" y="492" width="175" height="56" rx="7"/>
  <text x="97.5" y="511"><tspan x="97.5">Static metadata request</tspan><tspan x="97.5" dy="17">for a specific version</tspan></text>
  <polygon class="decision" points="470,472 545,520 470,568 395,520"/>
  <text x="470" y="503"><tspan x="470">Requested</tspan><tspan x="470" dy="17">system-version view</tspan><tspan x="470" dy="17">available?</tspan></text>
  <path class="edge" d="M185 520h210"/>
  <rect class="success" x="650" y="483" width="290" height="56" rx="7"/>
  <text x="795" y="494"><tspan x="795">Resolve effective static view</tspan><tspan x="795" dy="17">from exact system-version</tspan><tspan x="795" dy="17">over system-type</tspan></text>
  <path class="edge" d="M545 520h105"/>
  <text class="label" x="570" y="510">Yes</text>
  <rect class="failure" x="650" y="552" width="290" height="46" rx="7"/>
  <text x="795" y="575">Report version view unavailable</text>
  <path class="edge" d="M470 568v7h180"/>
  <text class="label" x="484" y="573">No</text>
  </g>

  <path class="divider" d="M10 656h930"/>

  <!-- System-type request -->
  <g transform="translate(0 52)">
  <rect class="entry" x="10" y="648" width="175" height="48" rx="7"/>
  <text x="97.5" y="664"><tspan x="97.5">Static metadata request</tspan><tspan x="97.5" dy="17">without a version</tspan></text>
  <polygon class="decision" points="470,624 545,672 470,720 395,672"/>
  <text x="470" y="655"><tspan x="470">Stable</tspan><tspan x="470" dy="17">system-version view</tspan><tspan x="470" dy="17">available?</tspan></text>
  <path class="edge" d="M185 672h210"/>
  <rect class="success" x="650" y="635" width="290" height="56" rx="7"/>
  <text x="795" y="646"><tspan x="795">Resolve effective static view</tspan><tspan x="795" dy="17">from latest stable system-version</tspan><tspan x="795" dy="17">over system-type</tspan></text>
  <path class="edge" d="M545 672h105"/>
  <text class="label" x="570" y="662">Yes</text>
  <rect class="success" x="650" y="708" width="290" height="42" rx="7"/>
  <text x="795" y="720"><tspan x="795">Use system-type alone if available;</tspan><tspan x="795" dy="17">otherwise report no static view</tspan></text>
  <path class="edge" d="M470 720v9h180"/>
  <text class="label" x="484" y="726">No</text>
  </g>
</svg>
