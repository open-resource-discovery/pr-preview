<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title description">
  <title id="title">ORD perspective resolution</title>
  <desc id="description">Resolution paths for tenant, specific system-version, and system-type metadata requests.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 8 4 0 8z" class="arrow-head"/>
    </marker>
    <style>
      svg { color-scheme: light dark; font-family: Arial, Helvetica, sans-serif; }
      .entry { fill: light-dark(#dae8fc, #1e3a5f); stroke: light-dark(#6c8ebf, #8ab4f8); stroke-width: 2; }
      .decision { fill: light-dark(#f5f5f5, #2b2d31); stroke: light-dark(#666, #c5c7ca); stroke-width: 1.5; }
      .success { fill: light-dark(#d5e8d4, #1f4328); stroke: light-dark(#82b366, #88cf8c); stroke-width: 2; }
      .failure { fill: light-dark(#f8cecc, #572727); stroke: light-dark(#b85450, #ef8b87); stroke-width: 2; }
      .edge { fill: none; stroke: light-dark(#4d4d4d, #d4d4d4); stroke-width: 1.5; marker-end: url(#arrow); }
      .arrow-head { fill: context-stroke; }
      text { fill: light-dark(#1f2328, #f2f3f5); font-size: 14px; text-anchor: middle; dominant-baseline: middle; }
      .label { font-size: 12px; paint-order: stroke; stroke: light-dark(#fff, #1b1b1b); stroke-width: 4px; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Tenant request -->
  <rect class="entry" x="10" y="26" width="175" height="48" rx="7"/>
  <text x="97.5" y="50">Tenant metadata request</text>
  <polygon class="decision" points="270,2 345,50 270,98 195,50"/>
  <text x="270" y="42"><tspan x="270">Tenant view</tspan><tspan x="270" dy="17">published?</tspan></text>
  <path class="edge" d="M185 50h10"/>
  <rect class="success" x="650" y="27" width="290" height="46" rx="7"/>
  <text x="795" y="42"><tspan x="795">Use only the complete</tspan><tspan x="795" dy="17">system-instance view</tspan></text>
  <path class="edge" d="M345 50h305"/>
  <text class="label" x="370" y="40">Yes</text>

  <polygon class="decision" points="270,107 345,155 270,203 195,155"/>
  <text x="270" y="147"><tspan x="270">Tenant version</tspan><tspan x="270" dy="17">known?</tspan></text>
  <path class="edge" d="M270 98v9"/>
  <text class="label" x="284" y="103">No</text>

  <polygon class="decision" points="470,107 545,155 470,203 395,155"/>
  <text x="470" y="138"><tspan x="470">Exact version view</tspan><tspan x="470" dy="17">available?</tspan></text>
  <path class="edge" d="M345 155h50"/>
  <text class="label" x="370" y="145">Yes</text>
  <rect class="success" x="650" y="118" width="290" height="56" rx="7"/>
  <text x="795" y="137"><tspan x="795">Resolve each ORD ID from exact</tspan><tspan x="795" dy="17">system-version, then system-type</tspan></text>
  <path class="edge" d="M545 155h105"/>
  <text class="label" x="570" y="145">Yes</text>
  <rect class="failure" x="650" y="190" width="290" height="46" rx="7"/>
  <text x="795" y="213">Report version view unavailable</text>
  <path class="edge" d="M470 203v10h180"/>
  <text class="label" x="484" y="209">No</text>

  <polygon class="decision" points="470,252 545,300 470,348 395,300"/>
  <text x="470" y="283"><tspan x="470">Stable version views</tspan><tspan x="470" dy="17">available?</tspan></text>
  <path class="edge" d="M270 203v97h125"/>
  <text class="label" x="284" y="220">No</text>
  <rect class="success" x="650" y="263" width="290" height="56" rx="7"/>
  <text x="795" y="282"><tspan x="795">Resolve each ORD ID from latest</tspan><tspan x="795" dy="17">system-version, then system-type</tspan></text>
  <path class="edge" d="M545 300h105"/>
  <text class="label" x="570" y="290">Yes</text>
  <rect class="success" x="650" y="335" width="290" height="46" rx="7"/>
  <text x="795" y="358">Use system-type alone</text>
  <path class="edge" d="M470 348v10h180"/>
  <text class="label" x="484" y="354">No</text>

  <!-- Explicit version request -->
  <rect class="entry" x="10" y="410" width="175" height="56" rx="7"/>
  <text x="97.5" y="429"><tspan x="97.5">Specific system-version</tspan><tspan x="97.5" dy="17">metadata request</tspan></text>
  <polygon class="decision" points="470,390 545,438 470,486 395,438"/>
  <text x="470" y="421"><tspan x="470">Requested version</tspan><tspan x="470" dy="17">view available?</tspan></text>
  <path class="edge" d="M185 438h210"/>
  <rect class="success" x="650" y="401" width="290" height="56" rx="7"/>
  <text x="795" y="420"><tspan x="795">Resolve each ORD ID from exact</tspan><tspan x="795" dy="17">system-version, then system-type</tspan></text>
  <path class="edge" d="M545 438h105"/>
  <text class="label" x="570" y="428">Yes</text>
  <rect class="failure" x="650" y="470" width="290" height="46" rx="7"/>
  <text x="795" y="493">Report version view unavailable</text>
  <path class="edge" d="M470 486v7h180"/>
  <text class="label" x="484" y="491">No</text>

  <!-- System-type request -->
  <rect class="entry" x="10" y="548" width="175" height="48" rx="7"/>
  <text x="97.5" y="564"><tspan x="97.5">System-type metadata</tspan><tspan x="97.5" dy="17">request</tspan></text>
  <polygon class="decision" points="470,524 545,572 470,620 395,572"/>
  <text x="470" y="555"><tspan x="470">Stable version views</tspan><tspan x="470" dy="17">available?</tspan></text>
  <path class="edge" d="M185 572h210"/>
  <rect class="success" x="650" y="535" width="290" height="56" rx="7"/>
  <text x="795" y="554"><tspan x="795">Resolve each ORD ID from latest</tspan><tspan x="795" dy="17">system-version, then system-type</tspan></text>
  <path class="edge" d="M545 572h105"/>
  <text class="label" x="570" y="562">Yes</text>
  <rect class="success" x="650" y="594" width="290" height="42" rx="7"/>
  <text x="795" y="615">Use system-type alone</text>
  <path class="edge" d="M470 620v8h180"/>
  <text class="label" x="484" y="626">No</text>
</svg>
