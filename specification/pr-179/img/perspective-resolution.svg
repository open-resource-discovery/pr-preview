<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" viewBox="0 0 960 700" role="img" aria-labelledby="title description">
  <title id="title">ORD perspective resolution</title>
  <desc id="description">Resolution paths for tenant, specific system-version, and system-type metadata requests, including unavailable published tenant views.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 8 4 0 8z" class="arrow-head"/>
    </marker>
    <style>
      svg { color-scheme: light dark; font-family: Arial, Helvetica, sans-serif; }
      .entry { fill: light-dark(#dae8fc, #1e3a5f); stroke: light-dark(#6c8ebf, #8ab4f8); stroke-width: 2; }
      .decision { fill: light-dark(#f5f5f5, #2b2d31); stroke: light-dark(#666, #c5c7ca); stroke-width: 1.5; }
      .success { fill: light-dark(#d5e8d4, #1f4328); stroke: light-dark(#82b366, #88cf8c); stroke-width: 2; }
      .failure { fill: light-dark(#f8cecc, #572727); stroke: light-dark(#b85450, #ef8b87); stroke-width: 2; }
      .edge { fill: none; stroke: light-dark(#4d4d4d, #d4d4d4); stroke-width: 1.5; marker-end: url(#arrow); }
      .arrow-head { fill: context-stroke; }
      text { fill: light-dark(#1f2328, #f2f3f5); font-size: 14px; text-anchor: middle; dominant-baseline: middle; }
      .label { font-size: 12px; paint-order: stroke; stroke: light-dark(#fff, #1b1b1b); stroke-width: 4px; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Tenant request -->
  <rect class="entry" x="10" y="26" width="175" height="48" rx="7"/>
  <text x="97.5" y="50">Tenant metadata request</text>
  <polygon class="decision" points="270,2 345,50 270,98 195,50"/>
  <text x="270" y="42"><tspan x="270">Tenant view</tspan><tspan x="270" dy="17">published?</tspan></text>
  <path class="edge" d="M185 50h10"/>
  <polygon class="decision" points="470,2 545,50 470,98 395,50"/>
  <text x="470" y="42"><tspan x="470">Tenant view</tspan><tspan x="470" dy="17">available?</tspan></text>
  <path class="edge" d="M345 50h50"/>
  <text class="label" x="370" y="40">Yes</text>
  <rect class="success" x="650" y="27" width="290" height="46" rx="7"/>
  <text x="795" y="42"><tspan x="795">Use only the complete</tspan><tspan x="795" dy="17">system-instance view</tspan></text>
  <path class="edge" d="M545 50h105"/>
  <text class="label" x="570" y="40">Yes</text>
  <rect class="failure" x="650" y="105" width="290" height="46" rx="7"/>
  <text x="795" y="128">Report tenant view unavailable</text>
  <path class="edge" d="M470 98v30h180"/>
  <text class="label" x="484" y="109">No</text>

  <polygon class="decision" points="270,142 345,190 270,238 195,190"/>
  <text x="270" y="182"><tspan x="270">Tenant version</tspan><tspan x="270" dy="17">known?</tspan></text>
  <path class="edge" d="M270 98v44"/>
  <text class="label" x="284" y="118">No</text>

  <polygon class="decision" points="470,142 545,190 470,238 395,190"/>
  <text x="470" y="173"><tspan x="470">Exact version view</tspan><tspan x="470" dy="17">available?</tspan></text>
  <path class="edge" d="M345 190h50"/>
  <text class="label" x="370" y="180">Yes</text>
  <rect class="success" x="650" y="163" width="290" height="56" rx="7"/>
  <text x="795" y="182"><tspan x="795">Resolve each ORD ID from exact</tspan><tspan x="795" dy="17">system-version, then system-type</tspan></text>
  <path class="edge" d="M545 190h105"/>
  <text class="label" x="570" y="180">Yes</text>
  <rect class="failure" x="650" y="235" width="290" height="46" rx="7"/>
  <text x="795" y="258">Report version view unavailable</text>
  <path class="edge" d="M470 238v20h180"/>
  <text class="label" x="484" y="249">No</text>

  <polygon class="decision" points="470,287 545,335 470,383 395,335"/>
  <text x="470" y="318"><tspan x="470">Stable version views</tspan><tspan x="470" dy="17">available?</tspan></text>
  <path class="edge" d="M270 238v97h125"/>
  <text class="label" x="284" y="255">No</text>
  <rect class="success" x="650" y="298" width="290" height="56" rx="7"/>
  <text x="795" y="317"><tspan x="795">Resolve each ORD ID from latest</tspan><tspan x="795" dy="17">system-version, then system-type</tspan></text>
  <path class="edge" d="M545 335h105"/>
  <text class="label" x="570" y="325">Yes</text>
  <rect class="success" x="650" y="370" width="290" height="46" rx="7"/>
  <text x="795" y="393">Use system-type alone</text>
  <path class="edge" d="M470 383v10h180"/>
  <text class="label" x="484" y="389">No</text>

  <!-- Explicit version request -->
  <rect class="entry" x="10" y="470" width="175" height="56" rx="7"/>
  <text x="97.5" y="489"><tspan x="97.5">Specific system-version</tspan><tspan x="97.5" dy="17">metadata request</tspan></text>
  <polygon class="decision" points="470,450 545,498 470,546 395,498"/>
  <text x="470" y="481"><tspan x="470">Requested version</tspan><tspan x="470" dy="17">view available?</tspan></text>
  <path class="edge" d="M185 498h210"/>
  <rect class="success" x="650" y="461" width="290" height="56" rx="7"/>
  <text x="795" y="480"><tspan x="795">Resolve each ORD ID from exact</tspan><tspan x="795" dy="17">system-version, then system-type</tspan></text>
  <path class="edge" d="M545 498h105"/>
  <text class="label" x="570" y="488">Yes</text>
  <rect class="failure" x="650" y="530" width="290" height="46" rx="7"/>
  <text x="795" y="553">Report version view unavailable</text>
  <path class="edge" d="M470 546v7h180"/>
  <text class="label" x="484" y="551">No</text>

  <!-- System-type request -->
  <rect class="entry" x="10" y="608" width="175" height="48" rx="7"/>
  <text x="97.5" y="624"><tspan x="97.5">System-type metadata</tspan><tspan x="97.5" dy="17">request</tspan></text>
  <polygon class="decision" points="470,584 545,632 470,680 395,632"/>
  <text x="470" y="615"><tspan x="470">Stable version views</tspan><tspan x="470" dy="17">available?</tspan></text>
  <path class="edge" d="M185 632h210"/>
  <rect class="success" x="650" y="595" width="290" height="56" rx="7"/>
  <text x="795" y="614"><tspan x="795">Resolve each ORD ID from latest</tspan><tspan x="795" dy="17">system-version, then system-type</tspan></text>
  <path class="edge" d="M545 632h105"/>
  <text class="label" x="570" y="622">Yes</text>
  <rect class="success" x="650" y="654" width="290" height="42" rx="7"/>
  <text x="795" y="675">Use system-type alone</text>
  <path class="edge" d="M470 680v8h180"/>
  <text class="label" x="484" y="686">No</text>
</svg>
